<svg width="760" height="332" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" viewBox="0 0 760 332" role="img" aria-label="VAE 的训练图（重参数化之后）：噪声 ε 从旁边输入，重构误差的梯度能传回编码器" font-size="13"><defs><marker id="vae-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6670"></path></marker><marker id="vae-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f73"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#202c29">VAE 的训练图（重参数化之后）：噪声 ε 从旁边输入，重构误差的梯度能传回编码器</text><rect x="272" y="52" width="196" height="40" rx="8" fill="#f4f1f7" stroke="#5b3f73" stroke-width="1.5"></rect><text x="370" y="70" font-weight="600" text-anchor="middle" fill="#202c29">KL[N(μ, Σ) ‖ N(0, I)]</text><text x="370" y="86" font-size="11.5" text-anchor="middle" fill="#68716b">把编码分布拉向先验</text><rect x="578" y="52" width="158" height="40" rx="8" fill="#f4f1f7" stroke="#5b3f73" stroke-width="1.5"></rect><text x="657" y="70" font-weight="600" text-anchor="middle" fill="#202c29">‖X − f(z; θ)‖<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"></tspan></text><text x="657" y="86" font-size="11.5" text-anchor="middle" fill="#68716b">重构误差</text><rect x="24" y="130" width="84" height="56" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="66" y="154" font-weight="600" text-anchor="middle" fill="#202c29">X</text><text x="66" y="172" font-size="11.5" text-anchor="middle" fill="#68716b">训练图像</text><rect x="134" y="120" width="126" height="76" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="197" y="146" font-weight="600" text-anchor="middle" fill="#202c29">编码器</text><text x="197" y="164" font-size="12" text-anchor="middle" fill="#202c29">q(Z | X)</text><text x="197" y="182" font-size="11.5" text-anchor="middle" fill="#68716b">参数 V</text><rect x="290" y="114" width="70" height="34" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="325" y="136" text-anchor="middle" fill="#202c29">μ(X)</text><rect x="290" y="168" width="70" height="34" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="325" y="190" text-anchor="middle" fill="#202c29">Σ(X)</text><rect x="392" y="128" width="160" height="60" rx="8" fill="#f4f1f7" stroke="#5b3f73" stroke-width="1.5"></rect><text x="472" y="153" font-weight="600" text-anchor="middle" fill="#202c29">z = μ + Σ<tspan dy="-5" font-size="10">1/2</tspan><tspan dy="5"> ⊙ ε</tspan></text><text x="472" y="172" font-size="11.5" text-anchor="middle" fill="#68716b">确定性的函数，可求导</text><rect x="392" y="222" width="160" height="48" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="472" y="242" font-weight="600" text-anchor="middle" fill="#202c29">ε ~ N(0, I)</text><text x="472" y="260" font-size="11.5" text-anchor="middle" fill="#68716b">随机性放在输入端</text><rect x="582" y="120" width="154" height="76" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="659" y="146" font-weight="600" text-anchor="middle" fill="#202c29">解码器</text><text x="659" y="164" font-size="12" text-anchor="middle" fill="#202c29">p(X | Z) 的均值 f(z; θ)</text><text x="659" y="182" font-size="11.5" text-anchor="middle" fill="#68716b">参数 θ</text><path d="M108 158H132" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M260 150L288 134" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M260 166L288 182" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M360 131L390 150" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M360 185L390 166" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M472 222V190" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M552 158H580" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M325 114V94" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M659 120V94" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#vae-arrow)"></path><path d="M659 196V300H197V198" fill="none" stroke="#5b3f73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#vae-plum)"></path><text x="428" y="318" font-size="12" text-anchor="middle" fill="#5b3f73">重构误差的梯度：解码器 → z → μ(X), Σ(X) → 编码器（ε 当作常数）</text></svg>
