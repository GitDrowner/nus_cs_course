<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="270" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" viewBox="0 0 760 270" role="img" aria-label="扩散模型是两条方向相反的马尔可夫链：前向固定加噪，反向学习去噪" font-size="13"><defs><marker id="dif-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6670"></path></marker><marker id="dif-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f73"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#202c29">扩散模型是两条方向相反的马尔可夫链：前向固定加噪，反向学习去噪</text><text x="24" y="62" font-size="12" font-weight="600" fill="#68716b">前向（扩散）过程 q：没有参数，每步混入一点高斯噪声</text><text x="24" y="252" font-size="12" font-weight="600" fill="#5b3f73">反向过程 Pr(· | ϕ)：神经网络学习每一步怎么去噪，生成时从 z<tspan dy="4" font-size="10">T</tspan><tspan dy="-4"> ~ N(0, I) 往回采样</tspan></text><circle cx="80" cy="150" r="27" fill="#f4f1f7" stroke="#5d6670" stroke-width="1.25"></circle><text x="80" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">x</text><circle cx="230" cy="150" r="27" fill="none" stroke="#5d6670" stroke-width="1.25"></circle><text x="230" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">z<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"></tspan></text><circle cx="380" cy="150" r="27" fill="none" stroke="#5d6670" stroke-width="1.25"></circle><text x="380" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">z<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"></tspan></text><text x="520" y="156" font-size="18" font-weight="600" text-anchor="middle" fill="#202c29">⋯</text><circle cx="660" cy="150" r="27" fill="none" stroke="#5d6670" stroke-width="1.25"></circle><text x="660" y="155" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">z<tspan dy="4" font-size="10">T</tspan><tspan dy="-4"></tspan></text><text x="660" y="198" font-size="12" text-anchor="middle" fill="#68716b">≈ N(0, I)</text><text x="80" y="198" font-size="12" text-anchor="middle" fill="#68716b">数据</text><path d="M100 130Q155.0 88 210 130" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#dif-arrow)"></path><text x="155.0" y="100" font-size="12" text-anchor="middle" fill="#202c29">q(z<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> | x)</tspan></text><path d="M210 170Q155.0 212 100 170" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#dif-plum)"></path><text x="155.0" y="216" font-size="12" text-anchor="middle" fill="#5b3f73">Pr(x | z<tspan dy="4" font-size="10">1</tspan><tspan dy="-4">, ϕ</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4">)</tspan></text><path d="M250 130Q305.0 88 360 130" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#dif-arrow)"></path><text x="305.0" y="100" font-size="12" text-anchor="middle" fill="#202c29">q(z<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> | z</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4">)</tspan></text><path d="M360 170Q305.0 212 250 170" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#dif-plum)"></path><text x="305.0" y="216" font-size="12" text-anchor="middle" fill="#5b3f73">Pr(z<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> | z</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">, ϕ</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">)</tspan></text><path d="M400 130Q450.0 88 506 130" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#dif-arrow)"></path><text x="450.0" y="100" font-size="12" text-anchor="middle" fill="#202c29">q(z<tspan dy="4" font-size="10">3</tspan><tspan dy="-4"> | z</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">)</tspan></text><path d="M506 170Q450.0 212 400 170" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#dif-plum)"></path><path d="M534 130Q590.0 88 640 130" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#dif-arrow)"></path><text x="590.0" y="100" font-size="12" text-anchor="middle" fill="#202c29">q(z<tspan dy="4" font-size="10">T</tspan><tspan dy="-4"> | z</tspan><tspan dy="4" font-size="10">T−1</tspan><tspan dy="-4">)</tspan></text><path d="M640 170Q590.0 212 534 170" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#dif-plum)"></path><text x="590.0" y="216" font-size="12" text-anchor="middle" fill="#5b3f73">Pr(z<tspan dy="4" font-size="10">T−1</tspan><tspan dy="-4"> | z</tspan><tspan dy="4" font-size="10">T</tspan><tspan dy="-4">, ϕ</tspan><tspan dy="4" font-size="10">T</tspan><tspan dy="-4">)</tspan></text></svg>
