<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="432" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" viewBox="0 0 760 432" role="img" aria-label="graph cut 的两个关键“零件”：割的代价 = 能量" font-size="13"><defs><marker id="gc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6670"></path></marker><marker id="gc-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b3f73"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#202c29">graph cut 的两个关键“零件”：割的代价 = 能量</text><rect x="24" y="48" width="344" height="368" rx="8" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="40" y="72" font-weight="600" fill="#202c29">二值 MRF：两个相邻像素 a、b</text><text x="40" y="90" font-size="11.5" fill="#68716b">源点一侧 = 标签 1，汇点一侧 = 标签 0</text><circle cx="196" cy="128" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="196" y="133" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">s</text><circle cx="96" cy="252" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="96" y="257" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">a</text><circle cx="296" cy="252" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="296" y="257" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">b</text><circle cx="196" cy="356" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="196" y="361" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">t</text><path d="M182.2 145.1L111.1 233.3" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M209.8 145.1L280.9 233.3" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M111.2 267.9L179.4 338.7" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M280.8 267.9L212.6 338.7" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M118.0 245.0L272.0 245.0" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#gc-plum)"></path><path d="M274.0 259.0L120.0 259.0" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#gc-plum)"></path><text x="118" y="180" font-size="12" text-anchor="end" fill="#202c29">U<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">(0)</tspan></text><text x="264" y="172" font-size="12" fill="#202c29">U<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">(0) + P(0, 0)</tspan></text><text x="124" y="318" font-size="12" text-anchor="end" fill="#202c29">U<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">(1) + P(1, 1)</tspan></text><text x="262" y="318" font-size="12" fill="#202c29">U<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">(1)</tspan></text><rect x="98" y="204" width="196" height="19" fill="#f4f1f7"></rect><text x="196" y="218" font-size="11.5" text-anchor="middle" fill="#5b3f73">a → b：P(1, 0) − P(1, 1) − P(0, 0)</text><text x="196" y="290" font-size="11.5" text-anchor="middle" fill="#5b3f73">b → a：P(0, 1)</text><text x="196" y="404" font-size="11.5" text-anchor="middle" fill="#68716b">要求 a → b 的容量 ≥ 0 ⇒ 子模条件</text><rect x="392" y="48" width="344" height="368" rx="8" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="408" y="72" font-weight="600" fill="#202c29">α 扩展：邻居 d = β、e = γ（都不是 α）</text><text x="408" y="90" font-size="11.5" fill="#68716b">源点 ᾱ 一侧 = 保留原标签，汇点 α 一侧 = 改成 α</text><circle cx="564" cy="128" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="564" y="133" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">ᾱ</text><circle cx="454" cy="252" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="454" y="257" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">d</text><circle cx="674" cy="252" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="674" y="257" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">e</text><circle cx="564" cy="252" r="16" fill="#fff" stroke="#5b3f73" stroke-width="1.5"></circle><text x="564" y="257" font-weight="600" text-anchor="middle" fill="#202c29">k</text><circle cx="564" cy="356" r="22" fill="#fff" stroke="#5d6670" stroke-width="1.25"></circle><text x="564" y="361" font-size="15" font-weight="600" text-anchor="middle" fill="#202c29">α</text><path d="M549.4 144.5L469.9 234.0" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M578.6 144.5L658.1 234.0" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M470.0 267.1L546.6 339.5" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M658.0 267.1L581.4 339.5" fill="none" stroke="#5d6670" stroke-width="1.25" marker-end="url(#gc-arrow)"></path><path d="M476.0 246.0L546.0 246.0" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#gc-plum)"></path><path d="M548.0 258.0L478.0 258.0" fill="none" stroke="#5d6670" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#gc-arrow)"></path><path d="M652.0 246.0L582.0 246.0" fill="none" stroke="#5b3f73" stroke-width="1.25" marker-end="url(#gc-plum)"></path><path d="M580.0 258.0L650.0 258.0" fill="none" stroke="#5d6670" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#gc-arrow)"></path><path d="M564.0 268.0L564.0 332.0" fill="none" stroke="#5b3f73" stroke-width="1.5" marker-end="url(#gc-plum)"></path><text x="492" y="180" font-size="12" text-anchor="end" fill="#202c29">U<tspan dy="4" font-size="10">d</tspan><tspan dy="-4">(α)</tspan></text><text x="636" y="180" font-size="12" fill="#202c29">U<tspan dy="4" font-size="10">e</tspan><tspan dy="-4">(α)</tspan></text><text x="494" y="318" font-size="12" text-anchor="end" fill="#202c29">U<tspan dy="4" font-size="10">d</tspan><tspan dy="-4">(β)</tspan></text><text x="634" y="318" font-size="12" fill="#202c29">U<tspan dy="4" font-size="10">e</tspan><tspan dy="-4">(γ)</tspan></text><text x="509" y="234" font-size="11.5" text-anchor="middle" fill="#5b3f73">P(β, α)</text><text x="619" y="234" font-size="11.5" text-anchor="middle" fill="#5b3f73">P(α, γ)</text><text x="509" y="278" font-size="12" text-anchor="middle" fill="#202c29">∞</text><text x="619" y="278" font-size="12" text-anchor="middle" fill="#202c29">∞</text><text x="572" y="312" font-size="11.5" fill="#5b3f73">P(β, γ)</text><text x="564" y="404" font-size="11.5" text-anchor="middle" fill="#68716b">两点都保留时只割 k → α，要求三角不等式</text></svg>
